name: Deploy

# Запускается после успешного CI на main (workflow_run), а не параллельно с ним.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/KnowledgeHub.Web/package-lock.json

      - name: Build SPA into wwwroot
        run: |
          npm --prefix src/KnowledgeHub.Web ci
          npm --prefix src/KnowledgeHub.Web run build

      - name: Publish API
        run: dotnet publish src/KnowledgeHub.Api -c Release -o out

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Миграции БД применяются самим приложением при старте (Database__MigrateOnStartup=true):
      # firewall PostgreSQL пускает только App Service, поэтому с runner'а до базы не достать.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: out

      - name: Health check
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 15 --retry-all-errors \
            "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"